<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASSAGE_X — Official Page</title>
  <meta name="description" content="Official mobile page with visual updates and featured posts." />
  <style>
    :root {
      --bg: #121418;
      --bg-soft: #1a1e25;
      --card: #1b2027;
      --card-2: #202631;
      --line: rgba(255,255,255,0.08);
      --text: #f2f4f7;
      --muted: #b7bec9;
      --accent: #ff7e5f;
      --accent-2: #ff9a76;
      --accent-shadow: rgba(255,126,95,0.28);
      --ok: #49d17a;
      --max: 440px;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top center, rgba(255,154,118,0.10), transparent 24%),
        radial-gradient(circle at bottom left, rgba(255,126,95,0.08), transparent 28%),
        linear-gradient(180deg, #101216 0%, #151920 100%);
      display: flex;
      justify-content: center;
      padding: 14px 10px 22px;
    }

    a { color: inherit; text-decoration: none; }

    .page { width: 100%; max-width: var(--max); }

    .shell {
      border: 1px solid var(--line);
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      box-shadow: 0 18px 60px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(6px);
      padding: 12px;
    }

    .card {
      background: linear-gradient(180deg, var(--card) 0%, var(--bg-soft) 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 10px;
    }

    .logo {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--line);
      overflow: hidden;
      background: linear-gradient(180deg, #2a3039, #1f242c);
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo-fallback {
      display: none;
      font-weight: 800;
      color: #d2d8e0;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    .brand { min-width: 0; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
      color: #d9dde5;
      font-size: 0.74rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 6px rgba(73,209,122,0.14);
    }

    .name {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.04;
      letter-spacing: -0.03em;
    }

    .hero-link {
      display: block;
      margin: 0 14px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #252b34 0%, #1f242c 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .hero {
      width: 100%;
      aspect-ratio: 5 / 4;
      position: relative;
      background:
        radial-gradient(circle at 70% 18%, rgba(255,154,118,0.16), transparent 18%),
        radial-gradient(circle at 25% 26%, rgba(255,126,95,0.10), transparent 16%),
        linear-gradient(180deg, #2a3039 0%, #222831 100%);
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-placeholder {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #c7ced8;
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.5;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00)),
        linear-gradient(135deg, rgba(255,154,118,0.10), rgba(255,126,95,0.06));
    }

    .content {
      padding: 16px 18px 10px;
      text-align: center;
    }

    .title {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 8vw, 2.35rem);
      line-height: 1.02;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .text {
      margin: 0 auto;
      max-width: 30ch;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.52;
    }

    .cta-wrap { padding: 14px 18px 16px; }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.01em;
      box-shadow: 0 12px 30px var(--accent-shadow);
      transition: transform .14s ease, box-shadow .14s ease, opacity .14s ease;
    }

    .cta:hover { transform: translateY(-1px); box-shadow: 0 15px 36px rgba(255,126,95,0.34); }
    .cta:active { transform: translateY(1px); opacity: 0.98; }

    .footer {
      padding: 0 18px 18px;
      text-align: center;
      color: #8f97a4;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    @media (min-width: 560px) {
      body { padding: 24px 16px 32px; }
      .shell { padding: 16px; }
      .head { padding: 16px 18px 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <section class="card">
        <header class="head">
          <a class="logo" href="./home.html" aria-label="Open next page">
            <img src="./logo.png" alt="Brand logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
            <span class="logo-fallback">MX</span>
          </a>
          <div class="brand">
            <div class="pill"><span class="dot"></span>Official page</div>
            <h1 class="name">MASSAGE_X</h1>
          </div>
        </header>

        <a class="hero-link" href="./home.html" aria-label="Open next page">
          <div class="hero">
            <img src="./hero.webp" alt="Featured image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div class="hero-placeholder">
              Place your main image here<br>
              File name: <strong style="margin-left:6px;">hero.webp</strong>
            </div>
          </div>
        </a>

        <div class="content">
          <h2 class="title">Visit Official Page</h2>
          <p class="text">Explore new posts, visual highlights, and selected content in one fast mobile page.</p>
        </div>

        <div class="cta-wrap">
          <a class="cta" href="./home.html" aria-label="Open next page">Visit Official Page</a>
        </div>

        <div class="footer">Put <strong>logo.png</strong> and <strong>hero.webp</strong> in the same folder as this file.</div>
      </section>
    </div>
  </main>
</body>
</html>
